name: GlyphFlow quality checks

on:
  push:
    branches:
      - main
      - fix/glyphflow-stability-foundation
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline module and project contracts
        run: node scripts/check.mjs
