name: GlyphFlow quality checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: glyphflow-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned project dependencies
        run: npm install --no-package-lock
      - name: Check project contracts
        run: npm run check
      - name: Build production PWA assets
        run: npm run build
      - name: Generate, convert, and parse a fixture TTF
        run: node scripts/font-smoke-test.mjs
      - name: Exercise Boolean geometry edge cases
        run: node scripts/geometry-edge-cases.mjs
      - name: Benchmark geometry complexity and cache reuse
        run: node scripts/geometry-performance.mjs
      - name: Install independent FontTools parser
        run: python -m pip install fonttools
      - name: Validate final TrueType fixture with FontTools
        run: python scripts/validate-ttf-fonttools.py

  browser-smoke-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-package-lock
      - name: Build production app for browser tests
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production browser interaction tests
        run: npm test
