name: GlyphFlow quality checks

on:
  push:
    branches:
      - main
      - fix/glyphflow-stability-foundation
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline module and project contracts
        run: node scripts/check.mjs
      - name: Install OpenType.js test dependency
        run: npm install --no-save --no-package-lock opentype.js@1.3.4
      - name: Generate, serialize, and parse a fixture OTF
        run: node scripts/font-smoke-test.mjs
      - name: Install independent FontTools parser
        run: python -m pip install fonttools
      - name: Validate fixture OTF with FontTools
        run: python scripts/validate-otf-fonttools.py
