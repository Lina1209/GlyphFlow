name: GlyphFlow quality checks

on:
  push:
    branches:
      - main
      - fix/glyphflow-stability-foundation
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline module and project contracts
        run: node scripts/check.mjs
      - name: Install OpenType.js test dependency
        run: npm install --no-save --no-package-lock opentype.js@1.3.4 fonteditor-core@2.6.3 perfect-freehand@1.2.0 polygon-clipping@0.15.7
      - name: Generate, convert, and parse a fixture TTF
        run: node scripts/font-smoke-test.mjs
      - name: Exercise Boolean geometry edge cases
        run: node scripts/geometry-edge-cases.mjs
      - name: Install independent FontTools parser
        run: python -m pip install fonttools
      - name: Validate final TrueType fixture with FontTools
        run: python scripts/validate-ttf-fonttools.py

  browser-smoke-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser test dependencies
        run: npm install --no-save --no-package-lock @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser interaction tests
        run: npx playwright test
