name: Prepare reproducible npm lockfile

on:
  push:
    branches:
      - fix/glyphflow-stability-foundation
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glyphflow-lockfile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pin npm resolver
        run: |
          npm install --global npm@10.9.4
          test "$(npm --version)" = "10.9.4"
      - name: Generate authentic npm lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); if(p.lockfileVersion!==3) process.exit(1); console.log('Lockfile v'+p.lockfileVersion+'; packages='+Object.keys(p.packages||{}).length)"
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: glyphflow-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          git commit -m "build: add reproducible npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
